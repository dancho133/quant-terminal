[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-terminal"
version = "0.1.0"
description = "Deterministic market research and risk sandbox."
requires-python = ">=3.11,<3.15"
dependencies = ["streamlit>=1.50,<2", "matplotlib>=3.9,<4"]

[project.scripts]
quant-terminal = "quant_terminal.run:main"
quant-terminal-demo = "quant_terminal.demo:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["quant_terminal*"]

[tool.setuptools.package-data]
quant_terminal = ["sample_data/*.csv", "sample_data/*.json", "sample_data/*.md", "dashboard/*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
