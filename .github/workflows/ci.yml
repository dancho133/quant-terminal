name: Verify research pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.3'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --offline --locked quant-terminal-demo --no-ui --output artifacts/ci
      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: research-artifacts-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci
